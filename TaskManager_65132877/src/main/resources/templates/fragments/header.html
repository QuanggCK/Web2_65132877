<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <nav th:fragment="header-nav" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-0 border-bottom border-secondary">
        <div class="container-fluid px-4">
            
            <a class="navbar-brand fw-bold text-info" th:href="@{/projects}">
                <i class="bi bi-layers-half me-2"></i>TaskManager
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarHeaderDropdown" aria-controls="navbarHeaderDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarHeaderDropdown">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link text-light-50" th:href="@{/projects}">
                            <i class="bi bi-grid-1x2 me-1"></i> Dự án
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light-50" th:href="@{/tasks}">
                            <i class="bi bi-list-task me-1"></i> Công việc
                        </a>
                    </li>
                </ul>

                <div class="d-flex align-items-center text-light" sec:authorize="isAuthenticated()">
                    <span class="me-3 bg-secondary bg-opacity-25 px-3 py-1 rounded-pill border border-secondary" style="font-size: 0.9rem;">
                        <i class="bi bi-person-fill text-info me-1"></i>
                        Xin chào, <strong class="text-warning" sec:authentication="name">User</strong>
                    </span>
                    <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm px-3">
                        <i class="bi bi-box-arrow-right me-1"></i>Đăng xuất
                    </a>
                </div>
            </div>
        </div>
    </nav>

</body>
</html>
