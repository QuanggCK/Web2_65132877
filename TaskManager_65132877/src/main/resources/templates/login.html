<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - TaskManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style th:inline="css">
        body {
            /* Loại bỏ màu xám mặc định, dùng màu tối trong suốt làm lớp phủ (overlay) lên ảnh */
            background-image: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)), 
                              url([[@{/tm.png}]]);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        .login-card {
            /* Giúp form đăng nhập nổi bật trên nền ảnh mờ kính */
            background: rgba(255, 255, 255, 0.9) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
        }
    </style>
</head>
<body>

    <div class="login-card p-4 p-sm-5 shadow-lg mx-3">
        <div class="text-center mb-4">
            <div class="display-5 text-info mb-2">
                <i class="bi bi-layers-half"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">TaskManager</h3>
            <p class="text-muted small">Vui lòng đăng nhập để quản lý công việc</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center role='alert'">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span class="small">Tài khoản hoặc mật khẩu không chính xác!</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show d-flex align-items-center role='alert'">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span class="small">Bạn đã đăng xuất thành công.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form th:action="@{/login}" method="post">
            
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold text-secondary small">Tên đăng nhập</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" id="username" name="username" class="form-control border-start-0 ps-0" placeholder="Nhập username" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-semibold text-secondary small">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" id="password" name="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-info w-100 fw-bold text-white py-2 shadow-sm mb-3">
                <i class="bi bi-box-arrow-in-right me-2"></i>Đăng Nhập
            </button>
            
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
