<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh Sửa Dự Án - TaskManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .main-wrapper {
            min-height: calc(100vh - 56px);
        }
        .form-card {
            border-radius: 12px;
            border: none;
        }
    </style>
</head>
<body class="bg-light">

    <div th:replace="~{fragments/header :: header-nav}"></div>

    <div class="d-flex main-wrapper">
        
        <div th:replace="~{fragments/sidebar :: sidebar-nav}"></div>
        
        <div class="flex-grow-1 p-4">
            <div class="container-fluid" style="max-width: 800px;">
                
                <nav aria-label="breadcrumb" class="mb-3">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/projects}" class="text-info text-decoration-none">Dự án</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Chỉnh sửa</li>
                    </ol>
                </nav>

                <div class="card form-card shadow-sm bg-white p-4 p-sm-5">
                    
                    <div class="d-flex align-items-center gap-3 border-bottom pb-3 mb-4">
                        <div class="bg-warning bg-opacity-10 p-3 rounded-circle text-warning fs-3 d-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
                            <i class="bi bi-pencil-square"></i>
                        </div>
                        <div>
                            <h3 class="fw-bold text-dark mb-1">Cập Nhật Dự Án</h3>
                            <p class="text-muted small mb-0">Thay đổi thông tin tiêu đề hoặc nội dung mô tả cốt lõi của dự án.</p>
                        </div>
                    </div>

                    <form th:action="@{/projects/update}" th:object="${project}" method="post">
                        
                        <input type="hidden" th:field="*{projectId}" />

                        <div class="mb-4">
                            <label for="projectName" class="form-label fw-bold text-secondary small">
                                Tên dự án <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted">
                                    <i class="bi bi-type border-0"></i>
                                </span>
                                <input type="text" 
                                       id="projectName" 
                                       th:field="*{projectName}" 
                                       class="form-control border-start-0 ps-0" 
                                       placeholder="Nhập tên dự án mới" 
                                       required 
                                       maxlength="255">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="description" class="form-label fw-bold text-secondary small">Mô tả dự án</label>
                            <textarea id="description" 
                                      th:field="*{description}" 
                                      class="form-control" 
                                      rows="5" 
                                      placeholder="Cập nhật mục tiêu, phạm vi hoạt động hoặc ghi chú chung cho dự án..."></textarea>
                        </div>

                        <div class="d-flex justify-content-end gap-3 border-top pt-4 mt-4">
                            <a th:href="@{/projects}" class="btn btn-light px-4 fw-semibold border text-secondary">
                                <i class="bi bi-x-circle me-1"></i> Hủy thay đổi
                            </a>
                            <button type="submit" class="btn btn-warning px-4 fw-bold text-dark shadow-sm">
                                <i class="bi bi-arrow-clockwise me-1"></i> Cập nhật dữ liệu
                            </button>
                        </div>

                    </form>
                    </div>
            </div>
        </div>
        
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
