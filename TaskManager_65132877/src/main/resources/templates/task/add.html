<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Công Việc Mới - TaskManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .main-wrapper {
            min-height: calc(100vh - 56px);
        }
        .form-card {
            border-radius: 12px;
            border: none;
        }
    </style>
</head>
<body class="bg-light">

    <div th:replace="~{fragments/header :: header-nav}"></div>

    <div class="d-flex main-wrapper">
        
        <div th:replace="~{fragments/sidebar :: sidebar-nav}"></div>
        
        <div class="flex-grow-1 p-4">
            <div class="container-fluid" style="max-width: 850px;">
                
                <nav aria-label="breadcrumb" class="mb-3">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/tasks}" class="text-info text-decoration-none">Công việc</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Thêm mới</li>
                    </ol>
                </nav>

                <div class="card form-card shadow-sm bg-white p-4 p-sm-5">
                    
                    <div class="d-flex align-items-center gap-3 border-bottom pb-3 mb-4">
                        <div class="bg-info bg-opacity-10 p-3 rounded-circle text-info fs-3 d-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
                            <i class="bi bi-clipboard-plus"></i>
                        </div>
                        <div>
                            <h3 class="fw-bold text-dark mb-1">Tạo Công Việc Mới</h3>
                            <p class="text-muted small mb-0">Thiết lập chi tiết công việc, thời hạn deadline và phân công nhân sự thực hiện.</p>
                        </div>
                    </div>

                    <form th:action="@{/tasks/save}" th:object="${task}" method="post">
                        
                        <div class="mb-4">
                            <label for="title" class="form-label fw-bold text-secondary small">
                                Tiêu đề công việc <span class="text-danger">*</span>
                            </label>
                            <input type="text" 
                                   id="title" 
                                   th:field="*{title}" 
                                   class="form-control" 
                                   placeholder="Ví dụ: Thiết kế giao diện Dashboard" 
                                   required 
                                   maxlength="255">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label for="project" class="form-label fw-bold text-secondary small">
                                    Thuộc dự án <span class="text-danger">*</span>
                                </label>
                                <select id="project" th:field="*{project}" class="form-select" required>
                                    <option value="" selected disabled>-- Chọn dự án --</option>
                                    <option th:each="p : ${projects}" 
                                            th:value="${p.projectId}" 
                                            th:text="${p.projectName}"></option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label for="priority" class="form-label fw-bold text-secondary small">
                                    Mức độ ưu tiên <span class="text-danger">*</span>
                                </label>
                                <select id="priority" th:field="*{priority}" class="form-select" required>
                                    <option value="LOW">Thấp</option>
                                    <option value="MEDIUM" selected>Trung bình</option>
                                    <option value="HIGH">Cao</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="assignedTo" class="form-label fw-bold text-secondary small">Người thực hiện</label>
                            <select id="assignedTo" th:field="*{assignedTo}" class="form-select">
                                <option value="">-- Chưa phân công (Bỏ trống) --</option>
                                <option th:each="u : ${users}" 
                                        th:value="${u.userId}" 
                                        th:text="${u.fullName + ' (' + u.username + ')'}"></option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label for="startDate" class="form-label fw-bold text-secondary small">Ngày bắt đầu</label>
                                <input type="date" id="startDate" th:field="*{startDate}" class="form-control">
                            </div>
                            <div class="col-md-6 mb-4">
                                <label for="deadline" class="form-label fw-bold text-secondary small">Hạn chót (Deadline)</label>
                                <input type="date" id="deadline" th:field="*{deadline}" class="form-control">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="description" class="form-label fw-bold text-secondary small">Mô tả công việc</label>
                            <textarea id="description" 
                                      th:field="*{description}" 
                                      class="form-control" 
                                      rows="5" 
                                      placeholder="Mô tả các bước thực hiện, yêu cầu kỹ thuật hoặc kết quả mong đợi..."></textarea>
                        </div>

                        <div class="d-flex justify-content-end gap-3 border-top pt-4 mt-4">
                            <a th:href="@{/tasks}" class="btn btn-light px-4 fw-semibold border text-secondary">
                                <i class="bi bi-x-circle me-1"></i> Hủy bỏ
                            </a>
                            <button type="submit" class="btn btn-info px-4 fw-bold text-white shadow-sm">
                                <i class="bi bi-check-circle me-1"></i> Tạo công việc
                            </button>
                        </div>

                    </form>
                    </div>
            </div>
        </div>
        
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
